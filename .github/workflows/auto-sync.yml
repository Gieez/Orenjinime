name: Auto Sync Anime

on:
  schedule:
    # Otomatis jalan setiap 3 jam sekali
    - cron: "0 */3 * * *"
  workflow_dispatch: # Bisa diklik manual dari tab Actions di GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Sync Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx ts-node scripts/sync.ts